name: "Tests: Backend"

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "serverboard/**"
      - "tests/backend/**"
      - "vitest.config.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "serverboard/**"
      - "tests/backend/**"
      - "vitest.config.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "Backend unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm run test:backend:unit

  e2e:
    name: "Backend E2E tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend E2E tests
        run: npm run test:backend:e2e
