name: "Tests: Backend"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "serverboard/**"
              - "tests/backend/**"
              - "vitest.config.mjs"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/test-backend.yml"

  backend-tests:
    name: "Backend tests (Node 22.x)"
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: npm ci

      - name: Run backend unit tests
        if: needs.changes.outputs.backend == 'true'
        run: npm run test:backend:unit

      - name: Run backend integration tests
        if: needs.changes.outputs.backend == 'true'
        run: npm run test:backend:e2e

      - name: Skip tests
        if: needs.changes.outputs.backend != 'true'
        run: echo "Skipped because no backend files changed"

  unit:
    name: "Backend unit tests"
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: npm ci

      - name: Run backend unit tests
        if: needs.changes.outputs.backend == 'true'
        run: npm run test:backend:unit

      - name: Skip tests
        if: needs.changes.outputs.backend != 'true'
        run: echo "Skipped because no backend files changed"

  e2e:
    name: "Backend E2E tests"
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: npm ci

      - name: Run backend E2E tests
        if: needs.changes.outputs.backend == 'true'
        run: npm run test:backend:e2e

      - name: Skip tests
        if: needs.changes.outputs.backend != 'true'
        run: echo "Skipped because no backend files changed"

  backend-gate:
    name: "Tests: Backend"
    needs: [changes, backend-tests, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check backend results
        run: |
          if [ "${{ needs.backend-tests.result }}" = "failure" ] || [ "${{ needs.unit.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "One or more backend tests failed"
            exit 1
          fi
          echo "All backend tests passed or were skipped"
