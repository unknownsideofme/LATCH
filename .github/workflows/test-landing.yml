name: "Tests: Landing"

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "tests/landing/**"
      - "vitest.config.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "landing/**"
      - "tests/landing/**"
      - "vitest.config.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "Landing unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Landing unit tests
        run: vitest run tests/landing/unit

  e2e:
    name: "Landing E2E tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Landing E2E tests
        run: vitest run tests/landing/e2e
