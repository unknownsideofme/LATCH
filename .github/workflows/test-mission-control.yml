name: "Tests: Mission Control"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      mission_control: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mission_control == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mission_control:
              - "mission-control/**"
              - "tests/mission-control/**"
              - "vitest.config.mjs"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/test-mission-control.yml"

  unit:
    name: "Mission Control unit tests"
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.mission_control == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        if: needs.changes.outputs.mission_control == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.mission_control == 'true'
        run: npm ci

      - name: Run Mission Control unit tests
        if: needs.changes.outputs.mission_control == 'true'
        run: npx vitest run tests/mission-control/unit

      - name: Skip tests
        if: needs.changes.outputs.mission_control != 'true'
        run: echo "Skipped because no mission-control files changed"

  e2e:
    name: "Mission Control E2E tests"
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.mission_control == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        if: needs.changes.outputs.mission_control == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.mission_control == 'true'
        run: npm ci

      - name: Run Mission Control E2E tests
        if: needs.changes.outputs.mission_control == 'true'
        run: npx vitest run tests/mission-control/e2e

      - name: Skip tests
        if: needs.changes.outputs.mission_control != 'true'
        run: echo "Skipped because no mission-control files changed"

  build:
    name: "Mission Control build"
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.mission_control == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        if: needs.changes.outputs.mission_control == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.mission_control == 'true'
        run: npm ci

      - name: Verify build
        if: needs.changes.outputs.mission_control == 'true'
        run: npm run build -w mission-control

      - name: Skip build
        if: needs.changes.outputs.mission_control != 'true'
        run: echo "Skipped because no mission-control files changed"

  mission-control-gate:
    name: "Tests: Mission Control"
    needs: [changes, unit, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check mission control results
        run: |
          if [ "${{ needs.unit.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "failure" ]; then
            echo "One or more mission control checks failed"
            exit 1
          fi
          echo "All mission control checks passed or were skipped"
