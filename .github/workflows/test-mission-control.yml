name: "Tests: Mission Control"

on:
  push:
    branches: [main]
    paths:
      - "mission-control/**"
      - "tests/mission-control/**"
      - "vitest.config.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "mission-control/**"
      - "tests/mission-control/**"
      - "vitest.config.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "Mission Control unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mission Control unit tests
        run: vitest run tests/mission-control/unit

  e2e:
    name: "Mission Control E2E tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mission Control E2E tests
        run: vitest run tests/mission-control/e2e

  build:
    name: "Mission Control build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build -w mission-control
