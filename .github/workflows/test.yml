name: "Tests: Full Suite"

# Runs ALL tests. Triggered manually or when shared config changes that
# could affect any workspace. Path-specific workflows handle the rest.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.full_suite == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            full_suite:
              - "vitest.config.mjs"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/test.yml"

  full-suite:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        if: needs.changes.outputs.full_suite == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        if: needs.changes.outputs.full_suite == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.full_suite == 'true'
        run: npm ci

      - name: Run full test suite
        if: needs.changes.outputs.full_suite == 'true'
        run: npm test

      - name: Verify Mission Control build
        if: needs.changes.outputs.full_suite == 'true'
        run: npm run build -w mission-control

      - name: Skip full suite
        if: needs.changes.outputs.full_suite != 'true'
        run: echo "Skipped full suite because core config did not change"
